[package]
name = "livekit-token"
version = "0.3.0"
license.workspace = true
description = "Core logic for generating LiveKit tokens"
edition.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
livekit-protocol = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }

# HS256 through jsonwebtoken's rust_crypto provider, resolved from crate
# features. An in-crate HMAC-only provider installed as jsonwebtoken's
# process default would also replace the provider of any other jsonwebtoken
# user in the process (RS/ES/EdDSA tokens would then fail).
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto"] }

[dev-dependencies]
serde_json = { workspace = true }

# How CI checks this crate's features, read by
# `.github/workflows/feature-combinations-curated.yml` via `cargo metadata`.
[package.metadata.feature-combinations]
mode = "powerset"
