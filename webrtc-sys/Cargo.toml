[package]
name = "webrtc-sys"
version = "0.3.49"
edition.workspace = true
homepage = "https://livekit.io"
license.workspace = true
description = "Unsafe bindings to libwebrtc"
repository.workspace = true

[features]
default = []

# Linux NVENC opt-in. Off by default because it requires CUDA Toolkit
# headers at build time. Enable from the consuming crate with:
#   webrtc-sys = { ..., features = ["nvenc-linux"] }
# Windows NVENC is always-on in this fork.
nvenc-linux = []

# How CI checks this crate's features, read by
# `.github/workflows/feature-combinations-curated.yml` via `cargo metadata`.
[package.metadata.feature-combinations]
mode = "powerset"

[dependencies]
cxx = "1.0"
log = { workspace = true }

[build-dependencies]
webrtc-sys-build = { workspace = true }
cxx-build = "1.0"
glob = "0.3"
cc = { workspace = true }
pkg-config = "0.3.22"

[target.'cfg(target_os = "linux")'.build-dependencies]
pkg-config = "0.3.22"
